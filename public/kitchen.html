<main id="main">

      <div>
        <a class="brand crave-brand" href="/"><img class="logo" src="/assets/crave-logo.png" alt="Crave." width="56" height="56"><span class="brand-sub">Kitchen board · Perfect Timing</span></a>

      </div>
    </div>
    <div id="msg"></div>
    <div class="kb-load" id="load" aria-label="Orders per pickup window"></div>
    <div class="kb-cols" id="cols"></div>
