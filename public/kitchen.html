<!doctype html>
<html lang="en" class="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f5ef">
<link rel="icon" href="/assets/crave-icon-64.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/crave-icon-180.png">
<meta property="og:image" content="https://crave.nealmedia.app/assets/crave-logo-og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600;1,9..144,800&family=Figtree:wght@400;500;600;700&family=Gochi+Hand&family=Cabin+Sketch:wght@700&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/crave.css">
<script src="/assets/shop.js"></script>
<meta name="robots" content="noindex">
<title>Kitchen screen | Crave Curbside</title>
</head>
<body class="admin kitchen">
<main id="main">
  <div class="page" style="max-width:1500px">
    <header class="k-head">
      <a class="brand crave-brand" href="/admin"><img class="logo" src="/assets/crave-logo.png" alt="Crave." width="64" height="60"><span class="brand-sub">Crave Curbside · Kitchen</span></a>
      <span class="k-clock" id="clock"></span>
    </header>
    <div id="board"></div>
  </div>
</main>
<script src="/assets/common.js"></script>
<script src="/assets/kitchen.js"></script>
<script>
  CraveBoard.mount(document.getElementById("board"));
  const clock = () => { document.getElementById("clock").textContent = new Date().toLocaleTimeString("en-US", { timeZone: "America/Anchorage", hour: "numeric", minute: "2-digit" }); };
  clock(); setInterval(clock, 15000);
</script>
</body>
</html>
