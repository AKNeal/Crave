<!doctype html>
<html lang="en" class="light">
<head>
<!--#head-->
<meta name="robots" content="noindex">
<title>Kitchen screen | Crave Curbside</title>
</head>
<body class="admin kitchen">
<main id="main">
  <div class="page" style="max-width:1500px">
    <header class="k-head">
      <a class="brand crave-brand" href="/admin"><img class="logo" src="/assets/crave-logo.png" alt="Crave." width="64" height="60"><span class="brand-sub">Crave Curbside · Kitchen</span></a>
      <span class="k-clock" id="clock"></span>
    </header>
    <div id="board"></div>
  </div>
</main>
<script src="/assets/common.js"></script>
<script src="/assets/kitchen.js"></script>
<script>
  CraveBoard.mount(document.getElementById("board"));
  const clock = () => { document.getElementById("clock").textContent = new Date().toLocaleTimeString("en-US", { timeZone: "America/Anchorage", hour: "numeric", minute: "2-digit" }); };
  clock(); setInterval(clock, 15000);
</script>
</body>
</html>
